<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a Customer</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="topbar">
  <div class="brand">Always Reviews</div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="add-customer.html" class="active">Add Customer</a>
    <a href="customers.html">Customers</a>
    <a href="settings.html">Settings</a>
  </nav>
  <div class="whoami">
    <span id="whoamiText"></span>
    <button id="signOutBtn" class="secondary">Sign out</button>
  </div>
</div>

<div class="page-center">
  <div class="card">
    <h1>Add a Customer</h1>
    <p class="subtitle">Enter their details and a photo of their project.</p>

    <form id="customerForm">
      <label for="firstName">First name *</label>
      <input type="text" id="firstName" required />

      <label for="fullName">Full name *</label>
      <input type="text" id="fullName" required />

      <label for="phone">Phone (WhatsApp, e.g. 27821234567)</label>
      <input type="tel" id="phone" placeholder="27821234567" pattern="[1-9][0-9]{7,14}" title="International format, digits only, no leading 0 or +, e.g. 27821234567" />

      <label for="email">Email *</label>
      <input type="email" id="email" required />

      <label for="serviceType">Service / job type *</label>
      <input type="text" id="serviceType" required />

      <label for="jobDate">Job completion date *</label>
      <input type="date" id="jobDate" required />

      <label for="photo">Project photo *</label>
      <input type="file" id="photo" accept="image/png,image/jpeg,image/jpg,image/webp,image/heic" required />

      <button type="submit" id="submitBtn" class="full-width">Add customer</button>
    </form>
    <div id="formMsg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="shared.js"></script>
<script>
  const CUSTOMER_INTAKE_WEBHOOK_URL = "https://n8n.ai4smartautomations.com/webhook/customer-intake";

  const formMsg = document.getElementById("formMsg");
  const whoamiText = document.getElementById("whoamiText");

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = "msg " + type;
  }
  function clearMsg(el) {
    el.textContent = "";
    el.className = "msg";
  }

  // International WhatsApp number, no leading zero or plus: country code + subscriber number, 8-15 digits total (E.164 without the "+").
  const WHATSAPP_REGEX = /^[1-9]\d{7,14}$/;

  let currentSession = null;
  let currentBusinessId = null;

  async function requireAuth() {
    currentSession = await getSession();
    if (!currentSession) {
      window.location.href = "login.html";
      return;
    }
    whoamiText.textContent = "Signed in as " + currentSession.user.email;

    try {
      ({ businessId: currentBusinessId } = await resolveBusinessContext(currentSession.user.id));
    } catch (err) {
      showMsg(formMsg, err.message, "error");
    }
  }

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await signOut();
    window.location.href = "index.html";
  });

  document.getElementById("customerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMsg(formMsg);

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Adding...";

    try {
      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const serviceType = document.getElementById("serviceType").value.trim();
      const jobDateValue = document.getElementById("jobDate").value;
      const phone = document.getElementById("phone").value.trim();
      const photoInput = document.getElementById("photo");

      if (!fullName) throw new Error("Full name is required.");
      if (!email) throw new Error("Email address is required.");
      if (!serviceType) throw new Error("Service / job type is required.");
      if (!jobDateValue) throw new Error("Job completion date is required.");
      if (photoInput.files.length === 0) throw new Error("A project photo is required.");
      if (phone && !WHATSAPP_REGEX.test(phone)) {
        throw new Error("Enter a valid WhatsApp number in international format, digits only, no leading 0 or +, e.g. 27821234567.");
      }

      if (!currentSession) throw new Error("You are not signed in.");
      if (!currentBusinessId) throw new Error("No business selected.");
      const businessId = currentBusinessId;

      const file = photoInput.files[0];
      const ext = file.name.split(".").pop();
      const base64 = await fileToBase64(file);
      const photoPayload = {
        photo_base64: base64,
        photo_mime_type: file.type,
        photo_ext: ext
      };

      const response = await fetch(CUSTOMER_INTAKE_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          business_id: businessId,
          first_name: document.getElementById("firstName").value.trim(),
          full_name: fullName,
          phone: phone || null,
          email: email,
          service_type: serviceType,
          job_completion_date: jobDateValue,
          consent_optin: true,
          ...photoPayload
        })
      });

      const result = await response.json();
      if (!response.ok || !result.success) {
        throw new Error(result.error || "Something went wrong adding the customer.");
      }

      showMsg(formMsg, "Customer added successfully.", "success");
      document.getElementById("customerForm").reset();
    } catch (err) {
      showMsg(formMsg, err.message || "Something went wrong.", "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add customer";
    }
  });

  requireAuth();
</script>
</body>
</html>
